[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "verisci"
version = "0.1.0"
description = "Verifiable Computational Science Benchmark Harness for GeoAI and Scientific Tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Md. Mokammel Morshed", email = "mdmokammelmorshed@gmail.com" }
]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=2.0.0",
    "geopandas>=1.0.0",
    "xarray>=2023.0.0",
    "pytest>=7.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/verisci"]
